<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>썩은 핀볼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --neon:#00f0ff;--pink:#ff2d95;--gold:#ffd400;--lime:#8cff3a;--muted:#9aa0d8;--line:#2a2f6e;
  --disp:"Black Han Sans","Noto Sans KR",sans-serif;--body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#06071a;color:#f3f4ff;font-family:var(--body);
  background-image:
    radial-gradient(ellipse at 0% 0%,rgba(255,45,149,.18),transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(0,240,255,.14),transparent 55%);
  background-attachment:fixed;
}
.app{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;max-width:1180px;margin:0 auto;padding:18px 16px}
@media (max-width:820px){.app{grid-template-columns:1fr}}
.panel{background:#0d1030;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;align-self:start}
h1{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.05;margin:0;
  background:linear-gradient(90deg,var(--neon),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(0,240,255,.55))}
.sec{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea,input[type=number],select{background:#070919;border:1px solid var(--line);border-radius:10px;color:#f3f4ff;font:14px var(--body);padding:9px 10px}
textarea{width:100%;min-height:92px;resize:vertical}
input[type=number]{width:84px}
select{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.capy{width:60px;height:52px;flex:none;filter:drop-shadow(0 0 8px rgba(255,154,31,.45));transform-origin:50% 90%;animation:capy 2.6s ease-in-out infinite}
@keyframes capy{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-2px)}}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--neon);outline-offset:1px}
.btn{border:0;border-radius:12px;padding:13px 16px;font:900 15px var(--body);color:#06071a;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.08)}
.btn.shuffle{background:var(--gold);box-shadow:0 0 18px rgba(255,212,0,.45)}
.btn.start{background:var(--lime);box-shadow:0 0 18px rgba(140,255,58,.45)}
.btn.start.stop{background:var(--pink);color:#fff;box-shadow:0 0 18px rgba(255,45,149,.5)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.sm{padding:9px 12px;font-size:13px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.maps button{background:#070919;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 6px;font:700 13px/1.3 var(--body);cursor:pointer}
.maps button[aria-pressed=true]{border-color:var(--neon);color:#fff;box-shadow:0 0 14px rgba(0,240,255,.45),inset 0 0 10px rgba(0,240,255,.15)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;background:#070919;border:1px solid var(--line);padding:7px 12px;cursor:pointer;user-select:none}
.chip input{accent-color:var(--neon);margin:0}
input[type=range]{accent-color:var(--neon);flex:1;min-width:80px}
#bgmVolLabel{font-size:12px;color:var(--muted);width:36px;text-align:right}
.status{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.status b{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--neon);margin-left:6px}
.results{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.results li{background:#070919;border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.results .rk{font-family:var(--disp);font-weight:400;width:36px;color:var(--muted)}
.results .dot{width:14px;height:14px;border-radius:50%;flex:none}
.results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results li.win{border-color:var(--gold);box-shadow:0 0 14px rgba(255,212,0,.4)}
.results li.win .tag{color:var(--gold);font-weight:900;font-size:12px}
.results li.empty{border-style:dashed;color:var(--muted);justify-content:center;font-weight:400}
.stage{display:flex;justify-content:center;align-items:flex-start}
.cabinet{position:relative;width:min(100%,560px);aspect-ratio:3/5;border-radius:22px;padding:10px;overflow:hidden;
  background:linear-gradient(180deg,#1a1f5c,#0b0d2c);border:2px solid #3a3f8a;
  box-shadow:0 0 0 6px #090b24,0 0 40px rgba(0,240,255,.25),0 0 90px rgba(255,45,149,.18),inset 0 0 30px rgba(0,0,0,.6)}
.cabinet:fullscreen{width:auto;height:100vh;max-width:100vw;margin:auto;border-radius:0}
#board{display:block;width:100%;height:100%;border-radius:14px;background:#04051a}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.tense{position:absolute;inset:10px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .3s;
  box-shadow:inset 0 0 90px rgba(255,45,149,.75),inset 0 0 30px rgba(255,0,60,.6)}
.tense.on{opacity:1;animation:pulse 1s ease-in-out infinite}
.tense span{position:absolute;top:18px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:26px;letter-spacing:.25em;color:#fff;
  text-shadow:0 0 12px var(--pink),0 0 24px var(--pink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,26,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.winner.show{display:flex}
.winner[hidden]{display:none}
.wcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
.winner.show .wcard{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.wl{font-family:var(--disp);font-size:22px;color:var(--gold);letter-spacing:.2em}
.wn{font-family:var(--disp);font-size:clamp(48px,12vw,86px);line-height:1.05;text-shadow:0 0 30px currentColor,0 0 60px currentColor;word-break:break-all}
.wm{color:#fff;font-weight:700;font-size:15px}
.cabinet.shake{animation:shake .55s}
@keyframes shake{
  0%,100%{transform:translateX(0)}15%{transform:translateX(-9px)}30%{transform:translateX(8px)}
  45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(2px)}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){
  .cabinet.shake,.tense.on,.winner.show .wcard,.capy{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand">
      <svg class="capy" viewBox="0 0 120 104" role="img" aria-label="카피바라">
        <circle cx="60" cy="13" r="10" fill="#ff9a1f"/>

        <ellipse cx="66" cy="3.5" rx="6" ry="3" fill="#5bd16a" transform="rotate(-20 66 3.5)"/>

        <ellipse cx="98" cy="31" rx="8" ry="6" fill="#8a5a36"/>
        <ellipse cx="22" cy="32" rx="4" ry="3" fill="#6b4428"/>
        <ellipse cx="98" cy="32" rx="4" ry="3" fill="#6b4428"/>
        <rect x="9" y="24" width="102" height="76" rx="30" fill="#b07a4f"/>
        <ellipse cx="60" cy="74" rx="41" ry="25" fill="#9c6b45"/>
        <ellipse cx="24" cy="62" rx="8" ry="4.5" fill="#ff8fa3" opacity=".65"/>
        <ellipse cx="96" cy="62" rx="8" ry="4.5" fill="#ff8fa3" opacity=".65"/>
        <path d="M30 46 Q37 52 44 46" stroke="#1d120a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M76 46 Q83 52 90 46" stroke="#1d120a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <rect x="41" y="57" width="38" height="15" rx="7.5" fill="#3b2416"/>
        <ellipse cx="51" cy="63" rx="3" ry="2" fill="#1d120a"/>
        <ellipse cx="69" cy="63" rx="3" ry="2" fill="#1d120a"/>
        <path d="M60 72 L60 79 M52 82 Q56 85 60 79 Q64 85 68 82" stroke="#3b2416" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <div class="sec">

    <div class="sec">
      <div class="lbl">맵</div>
      <div class="maps">
        <button data-map="wheel" aria-pressed="true">운명의<br>수레바퀴</button>
        <button data-map="bubble" aria-pressed="false">버블<br>범퍼</button>
        <button data-map="zigzag" aria-pressed="false">지그재그<br>계단</button>

    <div class="btns">
      <button class="btn shuffle" id="shuffle">섞기</button>
      <button class="btn start" id="start">시작</button>
      <button class="btn ghost" id="reset">초기화</button>
    </div>

    <div class="sec">
      <div class="lbl">난입</div>
      <div class="row"><label class="chip"><input type="checkbox" id="rider" checked>달달달달 라이더</label><label class="chip"><input type="checkbox" id="sabakOn" checked> 썩박궤</label></div>
    </div>

    <div class="sec">
      <div class="lbl">브금</div>
      <div class="row">
        <button class="btn ghost sm" id="bgmToggle">재생</button>
        <input type="range" id="bgmVol" min="0" max="100" value="45">
        <span id="bgmVolLabel">45%</span>

    <div class="row">
      <label class="chip"><input type="checkbox" id="sound" checked>효과음</label>
      <label class="chip"><input type="checkbox" id="slowmo" checked>슬로모션</label>
      <button class="btn ghost sm" id="fs">전체화면</button>

    <div class="status">

    <div class="sec">
      <div class="lbl">골인 순서</div>
      <ol class="results" id="results"></ol>

  </aside>

  <main class="stage">
    <div class="cabinet" id="cabinet">
      <canvas id="board"></canvas>
      <div class="flash" id="flash"></div>

      <div class="winner" id="winner">

          <div class="wl">당첨</div>

      </div>
    </div>
  </main>
</div>
<canvas id="fx"></canvas>
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
<audio id="daldal" src="assets/daldal7.mp3?v=2" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const {Engine, Bodies, Body, Composite, Events} = Matter;

/* ---------- 상수 ---------- */
const W = 600, H = 2068, VH = 1000, R = 11;
const GATE_Y = 118, FINISH_Y = 2020;
const RING = {x:300, y:1890, r:64, gapHalf:0.8, spd:0.021};
const PALETTE = ['#00f0ff','#ff2d95','#ffd400','#8cff3a','#ff7a1a','#b388ff','#ff4d4d','#3dffc5','#ff9ad5','#7cc4ff','#ffe08a','#c8ff8a'];
const LANES = [470,690,1010,1250,1450,1620];
const SPRITE_H = 175;
const STATE_TEXT = {ready:'준비', shuffle:'섞는 중', running:'진행 중', paused:'일시정지', done:'종료'};

const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
const cab = $('cabinet');
const bgm = $('bgm'), daldal = $('daldal');

/* ---------- 전역 ---------- */
let engine, world, balls = [], obstacles = [], spinners = [], movers = [], ring = null, gate = null;
let finished = [], particles = [], confetti = [], shocks = [], texts = [];
let state = 'ready', map = 'wheel', shuffleUntil = 0, winnerDone = false;
let cam = {x:0, y:0, zoom:1}, timeScale = 1, tense = false, heartAt = 0;
let riders = [], riderWarn = null, nextRiderAt = 0, engineNode = false;
let prerender = null, audio = null, lastTick = 0;
let dpr = 1, scale = 1, cssW = 0, cssH = 0, ringAngle = 0, winRank = 0, decisive = false;
let bgmWanted = false, lastTickSnd = 0;
// 썩박궤 난입 — quake 는 화면 지진(x, y, rot, zoom). shake() 함수(캐비닛 흔들기)와 이름이 겹치지 않게 분리
let sabak = null, nextSabakAt = 0, quake = {x:0, y:0}, rumble = null, worldM = null;
const sabakImg = new Image(); sabakImg.src = 'assets/sabak_cut.png';
const SABAK = {inMs:500, holdMs:1700, outMs:600};   // 등장 / 지진 / 퇴장
// 주먹 펀치: 등장 끝에 살짝 뒤로 빼고(WIND) → 화면 쪽으로 질러서(THRUST) → 렌즈에 '쾅'(IMPACT) → 반동
const PUNCH = {wind:180, thrust:160, recoil:220, fx:.32, fy:.71};   // fx, fy = 이미지 안 주먹 위치(비율)
const IMPACT = SABAK.inMs + PUNCH.thrust;
function punchK(T) {
  const a = SABAK.inMs;
  if (T < a - PUNCH.wind) return 0;
  if (T < a) return -.08 * Math.sin(Math.PI * (T - (a - PUNCH.wind)) / PUNCH.wind);
  if (T < IMPACT) { const u = (T - a) / PUNCH.thrust; return u * u; }
  return Math.exp(-(T - IMPACT) / PUNCH.recoil);
}
// 주먹의 화면 좌표와 이미지 배율 (흔들림 제외)
function sabakPose(T, ease) {
  const iw = sabakImg.naturalWidth || 1024, ih = sabakImg.naturalHeight || 664;
  const pk = punchK(T), sc0 = (W / iw) * (1 + .3 * ease);
  const cx = W * .5, cy = VH * .45 + (1 - ease) * VH * .7;
  let fx = cx + (PUNCH.fx - .5) * iw * sc0, fy = cy + (PUNCH.fy - .5) * ih * sc0;
  const pull = .35 * Math.max(0, pk);
  fx += (W * .5 - fx) * pull; fy += (VH * .45 - fy) * pull;
  return {iw, ih, pk, fx, fy, sc: sc0 * (1 + .95 * pk)};
}
function makeCracks(x, y) {
  const rays = [], n = 13;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rand(-.18, .18), len = rand(150, 430), seg = 6 + (i % 3);
    const pts = [{x, y}];
    for (let k = 1; k <= seg; k++) {
      const d = len * k / seg, j = rand(-11, 11);
      pts.push({x:x + Math.cos(a) * d - Math.sin(a) * j, y:y + Math.sin(a) * d + Math.cos(a) * j});
    }
    rays.push(pts);
    if (Math.random() < .45) {
      const m = pts[2 + (i % 2)], b = a + (Math.random() < .5 ? -1 : 1) * rand(.4, .8), bl = rand(50, 120);
      rays.push([m, {x:m.x + Math.cos(b) * bl * .5 + rand(-6, 6), y:m.y + Math.sin(b) * bl * .5 + rand(-6, 6)},
        {x:m.x + Math.cos(b) * bl, y:m.y + Math.sin(b) * bl}]);
    }
  }
  const main = rays.filter(r => r.length > 3), rings = [];
  for (const k of [1, 2]) rings.push(main.map(r => r[k]));
  return {x, y, rays, rings};
}
function playCrack() {
  if (!audio || !$('sound').checked) return;
  const t = audio.currentTime, len = Math.floor(audio.sampleRate * .3);
  const buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = buf; f.type = 'highpass'; f.frequency.setValueAtTime(1400, t);
  g.gain.setValueAtTime(.45, t);
  src.connect(f); f.connect(g); g.connect(audio.destination);
  src.start(t);
}
const SAND = ['#e8c88a', '#d8b47a', '#a87c45', '#6b4a26'];
// collisionStart 안에서 바꾼 속도·힘은 같은 스텝의 충돌 해소/힘 초기화에 덮여 사라진다 → 스텝이 끝난 뒤 적용
let pendingHits = [];
const SUBSTEPS = 2;
const BUMPER_MAX = 16;   // 범퍼가 튕겨내는 최고 속도 (px / 16.7ms)
const BALL_MAX = 26;     // 공 최고 속도 — 얇은 벽(14px) 터널링 방지
const SHUFFLE_MS = 2600; // 섞는 시간
const SHUFFLE_FLOW = 11; // 섞는 중 위·아래층 흐름 속도
const SHUFFLE_MAX = 14;  // 섞는 중 공 최고 속도
let shuffleStart = 0, nextJetAt = 0, shuffleDir = 1;

const riderImg = new Image();
riderImg.src = 'assets/rider.png';

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const getVel = b => Body.getVelocity ? Body.getVelocity(b) : b.velocity;
const getSpd = b => Body.getSpeed ? Body.getSpeed(b) : b.speed;

/* ---------- 참가자 ---------- */
function parseNames() {
  const out = [], colors = {};
  let ci = 0;
  const parts = $('names').value.split(/[,\n]/);
  for (let raw of parts) {
    raw = raw.trim();
    if (!raw) continue;
    let name = raw, n = 1;
    const m = raw.match(/^(.*?)\s*[*xX×]\s*(\d+)$/);
    if (m && m[1].trim()) { name = m[1].trim(); n = clamp(parseInt(m[2], 10) || 1, 1, 50); }
    if (!(name in colors)) colors[name] = PALETTE[ci++ % PALETTE.length];
    for (let i = 0; i < n && out.length < 300; i++) out.push({name, color: colors[name]});
    if (out.length >= 300) break;
  }
  return out;
}

/* ---------- 장애물 헬퍼 ---------- */
function makeObstacle(body, kind, color) {
  body.plugin = {kind, color, flash:0};
  Composite.add(world, body);
  obstacles.push(body);
  return body;
}
// Matter.js는 isStatic 물체를 만들 때 friction=1, restitution=0 으로 덮어쓴다(Body.setStatic).
// → 생성 뒤에 재질을 다시 넣어야 사양의 반발력(범퍼 1.4 등)이 실제로 적용된다.
// 장애물 마찰은 0: Matter.js의 접촉 마찰은 에너지 손실이 과해서 공이 램프에서 기어간다.
// (공 회전은 그리지 않으므로 미끄러짐과 굴러감은 겉보기로 차이가 없다.) 대기구역 게이트와 공끼리는 마찰 유지.
function mat(b, restitution, friction = 0) {
  b.restitution = restitution; b.friction = friction;
  return b;
}
// Bodies.circle은 반지름이 작으면 10~12각형이 돼서 울퉁불퉁하게 튄다 → 매끈한 다각형으로 직접 생성
function smoothCircle(x, y, r, opts, sides = 32) {
  const b = Bodies.polygon(x, y, sides, r, opts);
  b.circleRadius = r;
  return b;
}
function peg(x, y, r = 6, rest = .5) {
  return makeObstacle(mat(smoothCircle(x, y, r, {isStatic:true}, 24), rest), 'peg', '#00f0ff');
}
function bumper(x, y, r, col, rest = 1.4) {
  return makeObstacle(mat(smoothCircle(x, y, r, {isStatic:true}), rest), 'bumper', col);
}
function spinner(x, y, arms, len, spd, col = '#ff2d95') {
  const parts = [];
  for (let i = 0; i < arms; i++) parts.push(Bodies.rectangle(x, y, len * 2, 14, {angle: Math.PI * i / arms}));
  const b = mat(Body.create({parts, isStatic:true, label:'spinner'}), .6);
  b.plugin = {kind:'spinner', color:col, flash:0, arms, len, spd};
  Composite.add(world, b);
  spinners.push(b);
  return b;
}
function ramp(x, y, len, ang) {
  return makeObstacle(mat(Bodies.rectangle(x, y, len, 14, {isStatic:true, angle:ang}), .3), 'ramp', '#b388ff');
}
function wall(x, y, w, h, ang = 0, draw = false) {
  const b = mat(Bodies.rectangle(x, y, w, h, {isStatic:true, angle:ang, label:'wall'}), .4);
  if (draw) makeObstacle(b, 'wall', '#4af6ff');
  else Composite.add(world, b);
  return b;
}
function paddle(y, len, amp, spd, phase) {
  const b = makeObstacle(mat(Bodies.rectangle(300, y, len, 16, {isStatic:true}), .5), 'paddle', '#8cff3a');
  movers.push({body:b, y, amp, spd, phase, x:300});
  return b;
}

/* ---------- 맵 ---------- */
function buildWheel() {
  const sp = [{x:190, y:420, len:80}, {x:430, y:620, len:70}];
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const x = 52 + (r % 2) * 31 + c * 62, y = 195 + r * 64;
      if (x > 570) continue;
      if (sp.some(s => Math.hypot(x - s.x, y - s.y) < s.len + 28)) continue;
      peg(x, y, 6);
    }
  }
  spinner(190, 420, 3, 80, .028);
  spinner(430, 620, 4, 70, -.034);
  wall(119, 914, 340, 20, .42, true);
  wall(481, 914, 340, 20, -.42, true);
  spinner(300, 878, 2, 30, .09, '#ffd400');
  for (let r = 0; r < 7; r++) {
    const y = 1060 + r * 92;
    if (r % 2 === 0) { ramp(190, y, 380, .2); for (let c = 0; c < 3; c++) peg(490 + c * 36, y - 26, 6, .6); }
    else { ramp(410, y, 380, -.2); for (let c = 0; c < 3; c++) peg(40 + c * 36, y - 26, 6, .6); }
  }
  for (let c = 0; c < 7; c++) peg(60 + c * 80, 1690, 6, .6);
}
function buildBubble() {
  for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) {
    const x = 70 + (r % 2) * 58 + c * 116;
    if (x > 560) continue;
    bumper(x, 215 + r * 96, 24, PALETTE[(r + c) % 12], 1.4);
  }
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const x = 70 + ((r + 1) % 2) * 58 + c * 116;
    if (x > 560) continue;
    peg(x, 263 + r * 96, 5);
  }
  for (let i = 1; i <= 4; i++) wall(i * 120, 900, 14, 150, 0, true);
  for (let i = 0; i <= 4; i++) bumper(60 + i * 120, 820, 18, PALETTE[(i * 3) % 12], 1.2);
  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {
    const x = 55 + (r % 2) * 55 + c * 110;
    if (x > 570) continue;
    if (r === 2 && (c === 1 || c === 4)) continue;
    if (r === 4 && (c === 2 || c === 3)) continue;
    bumper(x, 1060 + r * 100, 16, PALETTE[(r * 2 + c) % 12], 1.3);
  }
  spinner(165, 1260, 3, 70, .04, '#00f0ff');
  spinner(435, 1460, 3, 70, -.04, '#00f0ff');
  for (let c = 0; c < 5; c++) bumper(80 + c * 110, 1690, 14, '#ffd400', 1.2);
}
function buildZigzag() {
  for (let r = 0; r < 6; r++) {
    const y = 215 + r * 94;
    if (r % 2 === 0) { ramp(200, y, 400, .17); for (let c = 0; c < 3; c++) peg(480 + c * 38, y - 28, 6, .6); }
    else { ramp(400, y, 400, -.17); for (let c = 0; c < 3; c++) peg(40 + c * 38, y - 28, 6, .6); }
  }
  wall(300, 900, 16, 200, 0, true);
  spinner(150, 900, 4, 95, .05, '#ff7a1a');
  spinner(450, 900, 4, 95, -.05, '#ff7a1a');
  for (let i = 0; i < 5; i++) paddle(1080 + i * 120, 220, 170, .0011 + i * .00025, i * 1.3);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) peg(75 + c * 150 + (r % 2) * 75, 1140 + r * 120, 7, .7);
  for (let c = 0; c < 7; c++) peg(60 + c * 80, 1690, 6, .6);
}
function buildFinish() {
  wall(80, 1729, 320, 20, .5, true);
  wall(520, 1729, 320, 20, -.5, true);
  for (const x of [165, 435]) {
    makeObstacle(mat(smoothCircle(x, 1776, 36, {isStatic:true, label:'pop'}), 1), 'pop', '#ff2d95');
  }
  wall(220, 1845, 16, 120, 0, true);
  wall(380, 1845, 16, 120, 0, true);
  const N = 18, parts = [];
  for (let i = 0; i < N; i++) {
    const a = i * Math.PI * 2 / N;
    const d = Math.abs(((a + Math.PI / 2 + Math.PI) % (Math.PI * 2)) - Math.PI);
    if (d < RING.gapHalf) continue;
    parts.push(Bodies.rectangle(RING.x + Math.cos(a) * RING.r, RING.y + Math.sin(a) * RING.r,
      2 * Math.PI * RING.r / N + 3, 12, {angle: a + Math.PI / 2}));
  }
  // 링은 마찰을 둬서 회전이 어깨에 얹힌 공을 실제로 실어 나르게 한다
  ring = mat(Body.create({parts, isStatic:true, label:'ring'}), .5, 1);
  ring.plugin = {kind:'ring', color:'#ffd400', flash:0};
  Composite.add(world, ring);
  ringAngle = 0;
  wall(196, 1988, 22, 140, 0, true);
  wall(404, 1988, 22, 140, 0, true);
}

/* ---------- 빌드 ---------- */
function build() {
  if (engine) { Events.off(engine); Composite.clear(engine.world, false); Engine.clear(engine); }
  engine = Engine.create({gravity:{x:0, y:1.15}, positionIterations:8, velocityIterations:6});
  world = engine.world;
  balls = []; obstacles = []; spinners = []; movers = []; finished = [];
  particles = []; shocks = []; texts = []; confetti = []; pendingHits = [];
  removeRiders(); riderWarn = null; killDaldal(); stopEngineSound();
  nextRiderAt = performance.now() + 3000;
  sabak = null; nextSabakAt = performance.now() + 9000; quake = {x:0, y:0}; stopRumble();

  wall(-20, H / 2, 40, H * 2);
  wall(620, H / 2, 40, H * 2);
  wall(300, -20, W * 2, 40);
  // 윗면은 GATE_Y-5 그대로, 아래로 두껍게(40px) → 섞을 때 공 무더기에 눌려도 뚫고 내려가지 않음
  gate = mat(Bodies.rectangle(300, GATE_Y - 5 + 20, 600, 40, {isStatic:true, label:'gate'}), .3, 1);
  Composite.add(world, gate);

  if (map === 'bubble') buildBubble();
  else if (map === 'zigzag') buildZigzag();
  else buildWheel();
  buildFinish();

  parseNames().forEach((e, i) => {
    const b = smoothCircle(rand(40, 560), rand(26, 96), R, {
      restitution:.5, friction:.03, frictionAir:.003, density:.002, label:'ball',
      collisionFilter:{category:2, mask:0xFFFF}
    });
    b.plugin = {name:e.name, color:e.color, trail:[], idx:i, still:0};
    Composite.add(world, b);
    balls.push(b);
  });

  Events.on(engine, 'collisionStart', onCollide);

  winnerDone = false; winRank = 0; decisive = false;
  $('winner').classList.remove('show');
  setTense(false);
  timeScale = 1;
  cam = {x:0, y:0, zoom:1};
  shuffleUntil = 0;
  setState('ready');
  updateCount();
  renderResults();
  buildPrerender();
}

/* ---------- 상태 ---------- */
function setState(s) {
  state = s;
  $('state').textContent = STATE_TEXT[s];
  const st = $('start');
  st.textContent = s === 'running' ? '멈춤' : s === 'paused' ? '계속' : '시작';
  st.classList.toggle('stop', s === 'running');
}
function setTense(on) {
  if (tense === on) return;
  tense = on;
  $('tense').classList.toggle('on', on);
  applyBgmVol();
}
function targetRank() {
  const total = balls.length + finished.length;
  const mode = $('rankMode').value;
  if (mode === 'last') return total;
  return clamp(parseInt($('rankN').value, 10) || 1, 1, Math.max(1, total));
}
function updateCount() { $('count').textContent = balls.length; }

/* ---------- 충돌 ---------- */
function onCollide(ev) {
  for (const p of ev.pairs) {
    const a = p.bodyA.parent || p.bodyA, b = p.bodyB.parent || p.bodyB;
    let ball, tgt;
    if (a.label === 'ball') { ball = a; tgt = b; }
    else if (b.label === 'ball') { ball = b; tgt = a; }
    else continue;
    if (tgt.label === 'ball' || !tgt.plugin || !tgt.plugin.kind) continue;
    const sp = (p.collision && p.collision.supports && p.collision.supports[0]) || ball.position;
    onHit(ball, tgt, {x:sp.x, y:sp.y});
  }
}
function onHit(ball, tgt, sp) {
  const v = getVel(ball), spd = Math.hypot(v.x, v.y);
  const kind = tgt.plugin.kind, col = tgt.plugin.color;
  tgt.plugin.flash = 1;
  const n = kind === 'bumper' ? 10 : kind === 'spinner' ? 8 : kind === 'ring' ? 6 : 4;
  if (kind !== 'wall' || spd > 4) burst(sp, n, col, spd * .6);

  if (kind === 'bumper') {
    // 능동 범퍼: 중심→공 방향으로 킥 (applyForce .012를 한 서브스텝 동안 준 것과 같은 속도 변화)
    pendingHits.push(() => {
      const dx = ball.position.x - tgt.position.x, dy = ball.position.y - tgt.position.y;
      const l = Math.hypot(dx, dy) || 1, v = getVel(ball);
      const kick = .012 / ball.mass * Math.pow(Body._baseDelta / SUBSTEPS, 2) * SUBSTEPS;
      let nx = v.x + dx / l * kick, ny = v.y + dy / l * kick;
      // 실제 핀볼 범퍼처럼 튕겨내는 속도에 상한 (반발력 1.4끼리 주고받으며 폭주하는 것 방지)
      const s = Math.hypot(nx, ny);
      if (s > BUMPER_MAX) { nx *= BUMPER_MAX / s; ny *= BUMPER_MAX / s; }
      Body.setVelocity(ball, {x:nx, y:ny});
    });
    playTick(kind, spd);
  } else if (kind === 'rider') {
    const rd = riders.find(r => r.body === tgt);
    const d = rd ? rd.dir : 1;
    const vx = d * (7 + Math.random() * 8), vy = -(7 + Math.random() * 9);
    pendingHits.push(() => Body.setVelocity(ball, {x:vx, y:vy}));
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(2, 10);
      addParticle({x:sp.x, y:sp.y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, color: i % 2 ? '#fff' : ball.plugin.color, size:rand(2, 5), dur:650});
    }
    shocks.push({x:sp.x, y:sp.y, r:4, v:9, life:1, color:'#ffd400', w:6});
    texts.push({x:sp.x, y:sp.y - 20, text:'쾅!', life:1});
    beep(140, .2, 'square', .2);
  } else if (kind === 'pop') {
    const dir = ball.position.x < tgt.position.x ? 1 : -1;
    const vx = dir * (3 + Math.random() * 4), vy = -(15 + Math.random() * 4);
    pendingHits.push(() => Body.setVelocity(ball, {x:vx, y:vy}));
    for (let i = 0; i < 45; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, s = rand(4, 14);
      addParticle({x:sp.x, y:sp.y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, g:.2, dur:700,
        color:['#ff2d95', '#ff9ad5', '#fff'][i % 3], size:rand(2, 5)});
    }
    shocks.push({x:tgt.position.x, y:tgt.position.y, r:4, v:8, life:1, color:'#ff2d95', w:6});
    shocks.push({x:tgt.position.x, y:tgt.position.y, r:0, v:12, life:1, color:'#ffffff', w:2});
    texts.push({x:tgt.position.x, y:tgt.position.y - 50, text:'POP!', life:.8});
    playPop();
  } else {
    playTick(kind, spd);
  }
}

/* ---------- 파티클 ---------- */
function pMax() { return sabak ? 1400 : 600; }
function addParticle(p) {
  particles.push(Object.assign({g:.18, life:1, dur:600, size:3, child:false}, p));
  if (particles.length > pMax()) particles.splice(0, particles.length - pMax());
}
function burst(sp, n, color, v) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * Math.max(1.5, v) + 1;
    addParticle({x:sp.x, y:sp.y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, color: i % 3 === 0 ? '#fff' : color, size:rand(1.5, 3.5), dur:500});
  }
}
function goalFirework(x, y, pl) {
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(3, 14);
    addParticle({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 5, g:.12, dur:950,
      color:['#ffffff', '#ffd400', pl.color, pl.color][i % 4], size:rand(2.5, 6), child: i % 6 === 0});
  }
  for (let i = 0; i < 30; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.1, s = rand(9, 18);
    addParticle({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, g:.22, dur:1300, color: i % 2 ? '#ffd400' : '#ff7a1a', size:rand(2, 5)});
  }
  shocks.push({x, y, r:6, v:9, life:1, color:'#ffffff', w:7});
  shocks.push({x, y, r:2, v:6, life:1, color:pl.color, w:4});
  shocks.push({x, y, r:0, v:13, life:1, color:'#ffd400', w:2});
  texts.push({x, y:y - 40, text:'GOAL!', sub:pl.name, color:pl.color, life:1});
  shake();
  playGoal();
}
function shake() {
  cab.classList.remove('shake'); void cab.offsetWidth; cab.classList.add('shake');
}
function flashOn() {
  const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}

/* ---------- 당첨 ---------- */
function announce(pl, rank) {
  winnerDone = true; winRank = rank;
  setTense(false);
  const wn = $('winName');
  wn.textContent = pl.name;
  wn.style.color = pl.color;
  $('winMeta').textContent = rank + '번째 골인';
  $('winner').classList.add('show');
  shake(); flashOn();
  const cx = innerWidth / 2, cy = innerHeight * .45;
  for (let i = 0; i < 220; i++) {
    confetti.push({x:cx + rand(-100, 100), y:cy, vx:rand(-9, 9), vy:rand(-22, -8), rot:Math.random() * 6.28, vr:rand(-.3, .3),
      color:PALETTE[i % PALETTE.length], w:rand(6, 14), h:rand(4, 10), life:1});
  }
  playFanfare();
  renderResults();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
}
function renderResults() {
  const ol = $('results');
  if (!finished.length) { ol.innerHTML = '<li class="empty">골인 없음</li>'; return; }
  ol.innerHTML = finished.map((p, i) => {
    const win = winnerDone && i + 1 === winRank;
    return `<li class="${win ? 'win' : ''}"><span class="rk">${i + 1}</span>` +
      `<span class="dot" style="background:${p.color};box-shadow:0 0 8px ${p.color}"></span>` +
      `<span class="nm">${esc(p.name)}</span>${win ? '<span class="tag">당첨</span>' : ''}</li>`;
  }).join('');
  if (winnerDone) {
    const w = ol.querySelector('.win');
    if (w && winRank === finished.length) w.scrollIntoView({block:'nearest'});
  } else ol.scrollTop = ol.scrollHeight;
}

/* ---------- 틱 ---------- */
function tick(dt, now) {
  const tr = targetRank();
  decisive = state === 'running' && !winnerDone && $('slowmo').checked &&
    (tr - finished.length === 1) && balls.some(b => b.position.y > RING.y - RING.r - 90);
  timeScale += ((decisive ? .38 : 1) - timeScale) * .12;
  setTense(decisive);
  if (decisive && now > heartAt) {
    heartAt = now + 820;
    beep(60, .25, 'sine', .25);
    setTimeout(() => beep(55, .2, 'sine', .18), 180);
  }

  if (state !== 'running' && sabak) endSabak();   // 멈춤 포함 — 진행 중이던 썩박궤는 즉시 종료

  if (state !== 'paused' && engine) {
    const ts = timeScale, d = dt * ts;

    if (state === 'shuffle') {
      if (now < shuffleUntil) shuffleStep(dt, now);
      else setState('ready');
    }

    if (state === 'running' && $('rider').checked) updateRider(dt, now);
    else if (riders.length || riderWarn) { removeRiders(); riderWarn = null; stopEngineSound(); }
    updateSabak(dt, decisive);

    for (let s = 0; s < SUBSTEPS; s++) {
      stepKinematics(dt, ts / SUBSTEPS);
      Engine.update(engine, d / SUBSTEPS);
      if (pendingHits.length) { const h = pendingHits; pendingHits = []; h.forEach(fn => fn()); }
      for (const b of balls) {
        const v = getVel(b), sp = Math.hypot(v.x, v.y);
        if (sp > BALL_MAX) Body.setVelocity(b, {x:v.x * BALL_MAX / sp, y:v.y * BALL_MAX / sp});
      }
    }

    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i], pl = b.plugin, p = b.position;
      pl.trail.push({x:p.x, y:p.y});
      if (pl.trail.length > 16) pl.trail.shift();
      if (p.y > H + 200 || p.x < -100 || p.x > 700) {
        Body.setPosition(b, {x:300, y:200}); Body.setVelocity(b, {x:0, y:0}); pl.trail = [];
        continue;
      }
      // 안티잼: 속도가 아니라 '실제로 어디론가 가고 있는지'로 판단한다.
      // 2초 동안 40px 반경을 못 벗어나면 끼인 것(멈춤이든, 범퍼-벽 사이에서 통통 왕복이든)
      // → 가운데 쪽 위로 튕겨내고, 같은 자리에서 또 끼면 점점 세게.
      const inRing = Math.hypot(p.x - RING.x, p.y - RING.y) < RING.r;   // 링 안에서 틈을 기다리는 건 정상
      if (!pl.anchor || inRing || p.y <= GATE_Y + 40 ||
          Math.hypot(p.x - pl.anchor.x, p.y - pl.anchor.y) > 40) {
        if (pl.anchor && Math.hypot(p.x - pl.anchor.x, p.y - pl.anchor.y) > 120) pl.jam = 0;
        pl.anchor = {x:p.x, y:p.y, t:now};
      } else if (now - pl.anchor.t > 2000) {
        pl.anchor.t = now;
        pl.jam = Math.min(4, (pl.jam || 0) + 1);
        const k = pl.jam, toCenter = Math.sign(300 - p.x) || 1;
        Body.applyForce(b, p, {x:(toCenter * .004 + (Math.random() - .5) * .006) * k, y:(-.008 - Math.random() * .004) * k});
        burst(p, 5, '#ffffff', 3);
      }
      if (p.y > FINISH_Y) {
        Composite.remove(world, b);
        balls.splice(i, 1);
        finished.push(pl);
        goalFirework(p.x, FINISH_Y - 24, pl);
        updateCount();
        if (!winnerDone && finished.length === targetRank()) announce(pl, finished.length);
        else renderResults();
      }
    }
    // 남은 공이 1개이고 그 공이 당첨 순위(마지막 골인 등)라면 결과가 이미 정해졌다 → 기다리지 않고 바로 발표
    if (state === 'running' && !winnerDone && balls.length === 1 && targetRank() === finished.length + 1) {
      const b = balls[0], pl = b.plugin;
      Composite.remove(world, b);
      balls.length = 0;
      finished.push(pl);
      goalFirework(b.position.x, b.position.y, pl);
      updateCount();
      announce(pl, finished.length);
    }
    if (state === 'running' && balls.length === 0) {

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];

// 섞기: 팝콘처럼 공마다 제각각 다른 순간에 사방으로 튀어 오르고(서로 독립적으로 흩어져 순서가 뒤섞임),
// 약한 회오리와 바닥 공기 분사가 더해져 공끼리 부딪히며 뒤죽박죽 섞인다.

  const dir = shuffleDir;                             // 섞기마다 무작위 방향으로 대기구역을 한 바퀴씩 순환
  const k = .12 * fade * dt / 16.67;
  if (left > 350) {
    for (const b of balls) {
      const pl = b.plugin;
      if (!pl.popAt || now >= pl.popAt) {
        pl.popAt = now + rand(120, 650);
        if (b.position.y > 45) {                        // 바닥 근처에 있을 때만 튀어 오름
          // 높이·간격을 공마다 크게 다르게: 위층(한쪽 흐름)에 머무는 시간이 달라져 이동 거리가 갈린다
          Body.setVelocity(b, {x:rand(-9, 9), y:-(Math.random() < .35 ? rand(3, 6) : rand(9, 14))});
        }
      }
    }
  }
  // 회오리(컨베이어형): 위층은 한쪽, 아래층은 반대쪽으로 흐른다. 팝콘으로 튀어 오른 공과 바닥에 있는 공이
  // 서로 다른 방향으로 실려 가므로, 공마다 튀는 타이밍에 따라 이동 거리가 달라져 순서가 확실히 섞인다.
  for (const b of balls) {
    const v = getVel(b);
    const layer = clamp((58 - b.position.y) / 50, -1, 1);   // 위 +1 … 아래 -1
    const target = SHUFFLE_FLOW * layer * dir;
    let vx = v.x + (target - v.x) * k, vy = v.y;
    const s = Math.hypot(vx, vy);
    if (s > SHUFFLE_MAX) { vx *= SHUFFLE_MAX / s; vy *= SHUFFLE_MAX / s; }
    Body.setVelocity(b, {x:vx, y:vy});
  }
  if (now >= nextJetAt && left > 300) {
    nextJetAt = now + rand(90, 150);
    const x0 = rand(40, 560);
    const lean = (300 - x0) / 300 * 5;                // 가장자리 분사는 반대편(가운데 너머)으로 비스듬히 뿜음
    for (const b of balls) {
      const dx = b.position.x - x0;
      if (Math.abs(dx) < 70 && b.position.y > 30) {
        const v = getVel(b);
        Body.setVelocity(b, {x:v.x + lean + dx / 70 * 3 + rand(-3, 3), y:v.y - rand(7, 11) * (1 - Math.abs(dx) / 140)});
      }
    }
    for (let i = 0; i < 12; i++) {
      addParticle({x:x0 + rand(-20, 20), y:GATE_Y - 6, vx:rand(-1.5, 1.5), vy:-rand(3, 9), g:.15, dur:450,
        color: i % 2 ? '#ffffff' : '#00f0ff', size:rand(1.5, 3.5)});
    }
    shocks.push({x:x0, y:GATE_Y - 4, r:2, v:4, life:.7, color:'#00f0ff', w:3});
    beep(rand(260, 420), .05, 'square', .035);
  }
}

// 회전·이동 장애물을 서브스텝마다 updateVelocity=true 로 움직인다.
// 그래야 충돌 계산이 이들의 실제 표면 속도를 알고 공을 쳐내거나 실어 나른다(순간이동 밀어내기 방지).
function stepKinematics(dt, f) {
  for (const s of spinners) Body.setAngle(s, s.angle + s.plugin.spd * f, true);
  if (ring) {
    const da = RING.spd * f;
    Body.rotate(ring, da, {x:RING.x, y:RING.y}, true);
    ringAngle += da;
  }
  for (const m of movers) {
    m.phase += m.spd * dt * f;
    m.x = 300 + Math.sin(m.phase) * m.amp;
    Body.setPosition(m.body, {x:m.x, y:m.y}, true);
  }
  for (const r of riders) {
    r.x += r.vx * f;
    Body.setPosition(r.body, {x:r.x, y:r.y + 20}, true);
  }
}

function updateCamera() {
  let tz = 1, tx = 0, ty = 0;
  if (state === 'running' || state === 'paused') {
    let lead = -Infinity;
    for (const b of balls) if (b.position.y > lead) lead = b.position.y;
    if (!balls.length) lead = H;
    ty = lead - VH * .58;
  } else if (state === 'done') ty = H - VH;
  if (decisive) {
    tz = 1.55;
    ty = RING.y + 10 - (VH / tz) * .62;
    tx = 300 - (W / tz) / 2;
  }
  ty = clamp(ty, 0, H - VH / tz);
  tx = clamp(tx, 0, W - W / tz);
  const k = decisive ? .07 : .09;
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  cam.zoom += (tz - cam.zoom) * .08;
  cam.x = clamp(cam.x, 0, W - W / cam.zoom);
  cam.y = clamp(cam.y, 0, H - VH / cam.zoom);
}

function polyPath(c, body) {

}
function drawObstacle(c, o) {
  const pl = o.plugin, f = pl.flash, p = o.position;

    c.fillStyle = f > 0 ? '#fff' : pl.color;

  } else if (pl.kind === 'bumper') {
    const r = o.circleRadius + f * 4;

    g.addColorStop(0, '#fff'); g.addColorStop(.45, pl.color); g.addColorStop(1, 'rgba(0,0,0,.6)');
    c.shadowColor = pl.color; c.shadowBlur = 14 + f * 25;

  } else if (pl.kind === 'ramp') {

    c.lineWidth = 2.5; c.strokeStyle = f > 0 ? '#fff' : '#4af6ff'; c.stroke();
  } else if (pl.kind === 'paddle') {

    c.shadowColor = '#8cff3a'; c.shadowBlur = 14 + f * 20;
    c.fillStyle = '#8cff3a'; c.fill();
    c.shadowBlur = 0; c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke();
    c.fillStyle = '#000';

  } else if (pl.kind === 'pop') {
    const r = o.circleRadius + f * 6;

    g.addColorStop(0, '#fff'); g.addColorStop(.5, '#ff2d95'); g.addColorStop(1, '#5a0032');

}
function drawSpinner(c, s) {

}
function roundRect(c, x, y, w, h, r) {

function drawConfetti(dt) {
  const w = innerWidth, h = innerHeight;
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  if (!confetti.length) return;
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.vy += .35; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;

/* ---------- 오디오 ---------- */
function ensureAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === 'suspended') audio.resume();
}
function beep(freq, dur, type = 'square', gain = .1) {
  if (!audio || !$('sound').checked) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + dur + .02);
}
function playTick(kind, spd) {
  const now = performance.now();
  if (now - lastTickSnd < 35) return;
  lastTickSnd = now;
  const m = timeScale < .8 ? .55 : 1;
  if (kind === 'bumper') beep((220 + Math.random() * 60) * m, .18, 'square', .07);
  else if (kind === 'spinner') beep(520 * m, .12, 'sawtooth', .04);
  else if (kind === 'ring') beep(330 * m, .15, 'triangle', .08);
  else beep((1400 + Math.min(spd, 20) * 40) * m, .06, 'square', .03);
}
function playPop() {
  beep(90, .22, 'sine', .3);
  beep(1800, .1, 'square', .08);
  setTimeout(() => beep(2400, .12, 'square', .06), 40);
}
function playGoal() {
  beep(880, .25, 'triangle', .12);
  setTimeout(() => beep(1320, .3, 'triangle', .1), 90);
}
function playFanfare() {
  [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, .5, 'triangle', .14), i * 110));
}
function bgmBase() { return (parseInt($('bgmVol').value, 10) || 0) / 100; }
function applyBgmVol() {
  const base = bgmBase();
  $('bgmVolLabel').textContent = Math.round(base * 100) + '%';
  bgm.volume = clamp(base * (tense ? .45 : 1), 0, 1);
  bgm.preservesPitch = false; bgm.mozPreservesPitch = false; bgm.webkitPreservesPitch = false;
  bgm.playbackRate = tense ? .72 : 1;
}
function bgmPlay() {
  bgmWanted = true;
  applyBgmVol();
  const p = bgm.play();
  if (p && p.then) p.then(() => { $('bgmToggle').textContent = '일시정지'; }).catch(() => { $('bgmToggle').textContent = '재생'; });
  else $('bgmToggle').textContent = '일시정지';
}
function bgmPause() {
  bgmWanted = false;
  bgm.pause();
  $('bgmToggle').textContent = '재생';
}
function startEngineSound() {
  engineNode = true;
  if (!$('sound').checked) return;
  try {
    daldal.pause();
    daldal.currentTime = 0;
    daldal.volume = Math.min(1, .55 + bgmBase() * .5);
    const p = daldal.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function stopEngineSound() { engineNode = false; }
function startRumble() {
  if (!audio || !$('sound').checked || rumble) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), lfo = audio.createOscillator(), lg = audio.createGain();
  const f = audio.createBiquadFilter(), g = audio.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(38, t);
  lfo.type = 'sine'; lfo.frequency.setValueAtTime(7, t); lg.gain.setValueAtTime(14, t);
  lfo.connect(lg); lg.connect(o.frequency);
  f.type = 'lowpass'; f.frequency.setValueAtTime(180, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .3);
  o.connect(f); f.connect(g); g.connect(audio.destination);
  o.start(t); lfo.start(t);
  rumble = {o, lfo, g};
}
function stopRumble() {
  if (!rumble || !audio) { rumble = null; return; }
  const r = rumble, t = audio.currentTime;
  rumble = null;
  try {
    r.g.gain.cancelScheduledValues(t);
    r.g.gain.setTargetAtTime(.0001, t, .12);
    r.o.stop(t + .6); r.lfo.stop(t + .6);
  } catch (e) {}
}
function killDaldal() {

  engineNode = false;
}

function resize() {
  const r = cv.getBoundingClientRect();
  cssW = r.width || 1; cssH = r.height || 1;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cssW / W;
  fx.width = Math.round(innerWidth * dpr); fx.height = Math.round(innerHeight * dpr);
  buildPrerender();
}
function loop(now) {
  const dt = Math.min(32, lastTick ? now - lastTick : 16);
  lastTick = now;
  tick(dt, now);
  draw(now);
  drawConfetti(dt);
  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
function doShuffle() {
  ensureAudio();
  if (bgm.paused) bgmPlay();
  if (state === 'running' || state === 'paused' || state === 'done') build();
  setState('shuffle');
  const now = performance.now();
  shuffleStart = now;
  shuffleUntil = now + SHUFFLE_MS;
  for (const b of balls) b.plugin.popAt = now + rand(0, 250);
  shuffleDir = Math.random() < .5 ? -1 : 1;
  nextJetAt = now;
  shake();
  beep(180, .12, 'sawtooth', .06);
  setTimeout(() => beep(260, .12, 'sawtooth', .06), 70);
}
$('shuffle').addEventListener('click', doShuffle);
$('start').addEventListener('click', () => {
  ensureAudio();
  if (state === 'running') {
    setState('paused');
    bgm.pause();
    killDaldal();
    return;
  }
  if (bgm.paused && (state !== 'paused' || bgmWanted)) bgmPlay();
  if (state === 'paused') { setState('running'); return; }
  if (state === 'done') build();
  if (!balls.length) build();
  if (gate) { Composite.remove(world, gate); gate = null; }
  shuffleUntil = 0;
  nextRiderAt = performance.now() + 3000;
  nextSabakAt = performance.now() + 9000;
  setState('running');
});
$('reset').addEventListener('click', () => build());
$('again').addEventListener('click', () => { build(); $('shuffle').click(); });
$('fillRange').addEventListener('click', () => {
  const n = clamp(parseInt($('rangeN').value, 10) || 20, 2, 300);
  $('rangeN').value = n;
  $('names').value = Array.from({length:n}, (_, i) => i + 1).join(', ');
  build();
});
$('names').addEventListener('change', () => { if (state === 'ready') build(); });
document.querySelectorAll('.maps button').forEach(btn => {
  btn.addEventListener('click', () => {
    map = btn.dataset.map;
    document.querySelectorAll('.maps button').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    build();
  });
});
$('bgmToggle').addEventListener('click', () => { if (bgm.paused) bgmPlay(); else bgmPause(); });
$('bgmVol').addEventListener('input', () => {
  applyBgmVol();
  try { localStorage.setItem('pinball-bgm-vol', $('bgmVol').value); } catch (e) {}
});
$('fs').addEventListener('click', () => {
  try { const p = cab.requestFullscreen && cab.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
});
document.addEventListener('fullscreenchange', () => setTimeout(resize, 50));
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(cv);

try {
  const v = localStorage.getItem('pinball-bgm-vol');
  if (v !== null && !isNaN(+v)) $('bgmVol').value = clamp(+v, 0, 100);
} catch (e) {}
applyBgmVol();

resize();
build();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildPrerender());
try { document.fonts.load('400 40px "Jua"').catch(() => {}); } catch (e) {}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
